/* ===== SUPABASE ===== */
function setSync(state,label){const el=$('#syncState');if(!el)return;el.className='sync'+(state?' on':'');el.querySelector('span').textContent=label}
async function checkAdmin(){
  if(!sb||!user){isAdmin=false;return false}
  try{
    const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();
    isAdmin=!!data;
    return isAdmin;
  }catch(e){isAdmin=false;return false}
}
async function ensureFirstAdmin(){
  if(!sb||!user)return false;
  try{
    const {data:all}=await sb.from('admins').select('user_id').limit(1);
    if(!all||all.length===0){
      await sb.from('admins').insert({user_id:user.id});
      isAdmin=true;
      return true;
    }
  }catch(e){console.warn('ensureFirstAdmin',e)}
  return await checkAdmin();
}
async function cloudSave(){
  if(!sb||!user)return;
  try{
    await sb.from('app_data').upsert({user_id:user.id,data:{deals,cust,invs,lang,theme:document.documentElement.dataset.theme||''},updated_at:new Date().toISOString()},{onConflict:'user_id'});
    setSync(true,'nuvem');
  }catch(e){console.warn('cloudSave',e);setSync(false,'local')}
}
async function cloudLoad(){
  if(!sb||!user)return;
  try{
    const {data,error}=await sb.from('app_data').select('data').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    if(data?.data){
      const d=data.data;
      if(Array.isArray(d.deals))deals=d.deals;
      if(Array.isArray(d.cust))cust=d.cust;
      if(Array.isArray(d.invs))invs=d.invs;
      if(d.lang)lang=d.lang;
      if(d.theme)document.documentElement.dataset.theme=d.theme;
      setSync(true,'nuvem');
      go(cur);
    }else{cloudSave()}
  }catch(e){console.warn('cloudLoad',e);setSync(false,'local')}
}
async function afterLogin(){
  if(!user){setSync(false,'local');showAuth();return}
  await ensureFirstAdmin();
  setSync(true,'nuvem');
  cloudLoad();
  hideAuth();
}
async function initAuth(){
  if(!sb){hideAuth();return}
  try{
    const {data:{session}}=await sb.auth.getSession();
    user=session?.user||null;
    if(user){await afterLogin()}else{showAuth()}
    sb.auth.onAuthStateChange(async(ev,sess)=>{
      user=sess?.user||null;
      if(user){await afterLogin()}
      else{isAdmin=false;setSync(false,'local');showAuth()}
    });
  }catch(e){console.warn('auth',e);showAuth()}
}

/* ===== TELA DE LOGIN ===== */
let authMode='login';
function showAuth(){$('#auth').classList.remove('hide')}
function hideAuth(){$('#auth').classList.add('hide')}
function setAuthMode(m){
  authMode=m;
  $$('.authBox .tab span').forEach(s=>s.classList.toggle('on',s.dataset.mode===m));
  $('#authTitle').textContent=m==='login'?'Entre na sua conta':'Crie sua conta';
  $('#authBtn').textContent=m==='login'?'Entrar':'Criar conta';
  $('#confirmWrap').style.display=m==='signup'?'block':'none';
  $('#rememberWrap').style.display=m==='login'?'flex':'none';
  $('#authSwitch').innerHTML=m==='login'?'Não tem conta? <a>Criar uma</a>':'Já tem conta? <a>Entrar</a>';
  $('#authMsg').textContent='';
}
function authMsg(txt,type){const m=$('#authMsg');m.textContent=txt;m.className='msg '+(type||'')}
async function doAuth(){
  const email=$('#authEmail').value.trim();
  const pass=$('#authPass').value;
  const pass2=$('#authPass2').value;
  const btn=$('#authBtn');
  if(!email||!pass){authMsg('Preencha todos os campos','err');return}
  if(pass.length<6){authMsg('Senha mínimo 6 caracteres','err');return}
  if(authMode==='signup'&&pass!==pass2){authMsg('Senhas não coincidem','err');return}
  if(!sb){authMsg('Supabase offline','err');return}
  btn.disabled=true;btn.textContent='Aguarde…';authMsg('');
  try{
    if(authMode==='login'){
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error){authMsg(error.message.includes('Invalid')?'E-mail ou senha incorretos':error.message,'err');return}
      authMsg('Bem-vindo de volta','ok');
    }else{
      const {error}=await sb.auth.signUp({email,password:pass});
      if(error){authMsg(error.message.includes('already')?'Este e-mail já está cadastrado':error.message,'err');return}
      authMsg('Conta criada! Entrando…','ok');
    }
  }catch(e){authMsg(e.message||'Erro','err')}
  finally{btn.disabled=false;btn.textContent=authMode==='login'?'Entrar':'Criar conta'}
}
document.addEventListener('click',e=>{
  const tab=e.target.closest('.authBox .tab span');
  if(tab){setAuthMode(tab.dataset.mode);return}
  const sw=e.target.closest('#authSwitch a');
  if(sw){setAuthMode(authMode==='login'?'signup':'login');return}
  if(e.target.id==='authBtn'){doAuth();return}
  if(e.target.id==='togglePass'){const p=$('#authPass');const t=e.target;p.type=p.type==='password'?'text':'password';t.textContent=p.type==='password'?'👁️':'🙈';return}
  if(e.target.id==='togglePass2'){const p=$('#authPass2');const t=e.target;p.type=p.type==='password'?'text':'password';t.textContent=p.type==='password'?'👁️':'🙈';return}
  
  const ch=e.target.closest('[data-chart]');
  if(ch){chartMonths=ch.dataset.chart;go('Overview');return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!$('#auth').classList.contains('hide')){
    if(e.target.id==='authEmail'||e.target.id==='authPass'||e.target.id==='authPass2'){doAuth()}
  }
});

function openAvatar(){
  const cur=localStorage.getItem('rapport-avatar')||'';
  openM(`<button class="x" data-x>✕</button>

    <div style="border-top:1px solid var(--line);padding-top:14px;margin-top:6px">
      <small style="display:block;color:var(--mut);font-size:11px;margin-bottom:8px">Conta</small>

      ${isAdmin?'<button class="btn" id="openAdmin" style="margin-top:10px;width:100%">Painel admin</button>':''}
    </div>
    <input type="file" id="avFile" accept="image/*" hidden>`,'inv');
  document.getElementById('avPick').onclick=()=>document.getElementById('avFile').click();
  if(cur)document.getElementById('avDel').onclick=()=>{
    localStorage.removeItem('rapport-avatar');setAvatarUI('');closeM();toast('Foto removida');
  };
  const ob=document.getElementById('avOut');
  if(ob)ob.onclick=doLogout;
  const oa=document.getElementById('openAdmin');
  if(oa)oa.onclick=openAdmin;
  document.getElementById('avFile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>4*1024*1024)return toast('✕ Imagem muito grande (máx 4MB)');
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=async()=>{
        const S=256,c=document.createElement('canvas');c.width=S;c.height=S;
        const ctx=c.getContext('2d');const m=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
        const url=c.toDataURL('image/jpeg',0.82);
        try{localStorage.setItem('rapport-avatar',url)}catch(err){return toast('✕ Armazenamento cheio')}
        setAvatarUI(url);
        const pv=document.getElementById('avPreview');if(pv)pv.innerHTML=`<img src="${url}">`;
        toast('Foto atualizada');
        if(sb&&user){
          try{
            const blob=await(await fetch(url)).blob();
            const path=`${user.id}/avatar.jpg`;
            const up=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
            if(!up.error){
              const {data}=sb.storage.from('avatars').getPublicUrl(path);
              localStorage.setItem('rapport-avatar',data.publicUrl+'?t='+Date.now());
              setAvatarUI(localStorage.getItem('rapport-avatar'));
            }
          }catch(err){console.warn('avatar upload',err)}
        }
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
}

  {i:'⋈',a:'share',t:'Exportar backup'},
  {i:'⇪',a:'up',t:'Importar backup'},

$('#side').innerHTML=sideItems.map(x=>`<button data-sb="${x.a}" data-tip="${x.t}">${x.i}</button>`).join('')+'<hr><button data-sb="cog" data-tip="Ajustes">⚙</button><button data-sb="moon" data-tip="Tema" id="th">☾</button>';
$('#nav').onclick=e=>{if(e.target.dataset.t)go(e.target.dataset.t)};

document.addEventListener('click',e=>{const t=e.target;
if(t.closest('[data-notif]')){openNotifs();return}
if(t.id==='avatarBtn'){openAvatar();return}
if(t.dataset.new){({deal:newDeal,cust:newCust,inv:newInv})[t.dataset.new]();return}
const sr=t.closest('[data-r]');if(sr){srch(sr.dataset.r);return}
if(t.dataset.lg){lang=t.dataset.lg;document.documentElement.lang=lang=='pt'?'pt-BR':'en';closeM();go(cur);return}
if(t.dataset.act){act(t.dataset.act);return}
if(t.dataset.f){cf=t.dataset.f;go('Customers');return}if(t.dataset.v){cv=t.dataset.v;go('Customers');return}
if(t.dataset.s&&t.classList.contains('star')){const c=cust.find(c=>c.i==t.dataset.s);c.f=c.f?0:1;custList();return}
const r=t.closest('tr.r');if(r){invModal(r.dataset.i);return}
const d=t.closest('.deal');if(d&&!$('#m').classList.contains('show'))dealModal(d.dataset.id)});
document.addEventListener('input',e=>{if(e.target.id=='sq'){q=e.target.value.toLowerCase();custList()}});
let drag=null;
document.addEventListener('dragstart',e=>{const d=e.target.closest('.deal');if(d){drag=+d.dataset.id;d.classList.add('dragging')}});
document.addEventListener('dragend',e=>{drag=null;$$('.over,.dragging').forEach(x=>x.classList.remove('over','dragging'))});
document.addEventListener('dragover',e=>{const z=e.target.closest('.col,.drop');if(z&&drag!=null){e.preventDefault();$$('.over').forEach(x=>x.classList.remove('over'));z.classList.add('over')}});
document.addEventListener('drop',e=>{const z=e.target.closest('.col,.drop');if(!z||drag==null)return;e.preventDefault();const d=deals.find(x=>x.id==drag);
if(z.dataset.w!=null){const w=z.dataset.w=='1',i=deals.indexOf(d);deals.splice(i,1);go('Pipeline');toast(`${w?'🏆':'✕'} ${d.t} ${w?'won':'lost'} · ${F(d.a)}`,()=>{deals.splice(i,0,d);go('Pipeline')})}
else if(z.dataset.s!=d.s){const o=d.s;d.s=z.dataset.s;go('Pipeline');toast(`✓ ${d.t} → ${stg.find(s=>s[1]==d.s)[0]}`,()=>{d.s=o;go('Pipeline')})}drag=null});
$('#side').onclick=e=>{const k=e.target.dataset.sb;if(!k)return;({search:openSearch,plus:newDeal,star:()=>{fav=!fav;cf='All';go('Customers');toast(fav?'Showing starred only':'Showing all')},cal:()=>go('Schedule'),phone:()=>go('Customers'),send:shareApp,share:exportB,up:()=>$('#imp').click(),cog:settings,moon:()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark';save()}})[k]()};

/* ===== CRUD FORMS ===== */
function form(title,fs,ok){openM(`<button class="x" data-x>✕</button><h2 style="margin:0 0 6px;font-size:24px;font-weight:500">${title}</h2>${fs.map(f=>`<label class="field">${f.l}${f.o?`<select data-k="${f.k}">${f.o.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:`<input data-k="${f.k}" type="${f.t||'text'}">`}</label>`).join('')}<button class="btn" id="fs" style="margin-top:18px">Save</button>`,'inv');
$('#fs').onclick=()=>{const v={};$$('#mb [data-k]').forEach(e=>v[e.dataset.k]=e.value.trim());if(ok(v)!==false)closeM()}}
function newDeal(){form('New deal',[{k:'t',l:'Deal name'},{k:'c',l:'Company'},{k:'a',l:'Value',t:'number'},{k:'s',l:'Stage',o:stg.map(s=>[s[1],s[0]])},{k:'d',l:'Expected close (e.g. Nov 12)'}],v=>{if(!v.t||!(+v.a>0))return false;deals.push({id:Date.now(),t:v.t,c:v.c||'—',a:+v.a,s:v.s,d:v.d||'TBD'});go('Pipeline');toast('✓ '+v.t+' → '+stg.find(s=>s[1]==v.s)[0])})}
function newCust(){form('New customer',[{k:'n',l:'Name'},{k:'r',l:'Role'},{k:'co',l:'Company'},{k:'seg',l:'Segment',o:[['Enterprise','Enterprise'],['Mid-market','Mid-market'],['SMB','SMB']]},{k:'p',l:'Open pipeline value',t:'number'}],v=>{if(!v.n)return false;cust.push({i:Date.now(),n:v.n,r:v.r||'—',co:v.co||'—',p:+v.p||0,l:'just now',seg:v.seg,sc:50,f:0});go('Customers')})}
function newInv(){form('New invoice',[{k:'c',l:'Customer'},{k:'p',l:'Contact'},{k:'city',l:'City'},{k:'a',l:'Amount',t:'number'},{k:'it',l:'Description'},{k:'d',l:'Due date (e.g. Nov 30)'}],v=>{if(!v.c||!(+v.a>0))return false;invs.unshift({id:'RP-'+(Math.max(2400,...invs.map(x=>+x.id.slice(3)||0))+1),c:v.c,p:v.p||'—',city:v.city||'—',i:'Today',d:v.d||'Net 30',a:+v.a,s:'Draft',it:v.it||'Services'});go('Finance')})}

/* ===== BUSCA GLOBAL ===== */
function openSearch(){openM(`<button class="x" data-x>✕</button><input class="in" id="gs" placeholder="Search deals, customers, invoices…" style="max-width:none;width:calc(100% - 50px)"><div id="gr" style="margin-top:12px"></div>`,'inv');$('#gs').focus();
$('#gs').oninput=e=>{const s=e.target.value.toLowerCase();if(!s){$('#gr').innerHTML='';return}const r=[...deals.filter(d=>(d.t+d.c).toLowerCase().includes(s)).map(d=>['Deal',d.t+' · '+d.c,'D'+d.id]),...cust.filter(c=>(c.n+c.co).toLowerCase().includes(s)).map(c=>['Customer',c.n+' · '+c.co,'C'+c.n]),...invs.filter(v=>(v.id+v.c).toLowerCase().includes(s)).map(v=>['Invoice',v.id+' · '+v.c,'I'+v.id])].slice(0,8);
$('#gr').innerHTML=r.map(x=>`<div data-r="${x[2]}" style="padding:10px;border-radius:14px;cursor:pointer;display:flex;gap:10px;background:var(--in);margin-bottom:6px"><small style="width:70px;color:var(--mut)">${x[0]}</small>${x[1]}</div>`).join('')||'<small style="color:var(--mut)">No results</small>';tr($('#gr'))}}
function srch(r){const k=r[0],v=r.slice(1);closeM();if(k=='D')dealModal(+v);if(k=='I')invModal(v);if(k=='C'){q=v.toLowerCase();cf='All';fav=false;go('Customers')}}

/* ===== CONFIGURAÇÕES ===== */
function settings(){openM(`<button class="x" data-x>✕</button><h2 style="margin:0 0 14px;font-size:24px;font-weight:500">Settings</h2>
<small style="color:var(--mut)">Language</small><div style="display:flex;gap:8px;margin:8px 0 18px"><button class="btn ${lang=='en'?'':'o'}" data-lg="en">English</button><button class="btn ${lang=='pt'?'':'o'}" data-lg="pt">Português</button></div>
<small style="color:var(--mut)">Sincronização</small>
<div style="margin:8px 0 18px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <span class="sync on"><b></b><span>nuvem (${user?.email||''})</span></span>
  <button class="btn o" id="cfgOut">Sair</button>
  ${isAdmin?'<button class="btn" id="cfgAdmin">Painel admin</button>':''}
</div>
<small style="color:var(--mut)">Seus dados</small><p style="margin:6px 0 12px;font-size:13px">Salvos na nuvem e neste aparelho.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn o" data-act="export">Export backup</button><button class="btn o" data-act="import">Import backup</button><button class="btn o" data-act="clear">Clear sample data</button><button class="btn o" data-act="restore">Restore sample data</button></div>`,'inv');
const o=$('#cfgOut');if(o)o.onclick=doLogout;
const a=$('#cfgAdmin');if(a)a.onclick=openAdmin;
}
function exportB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({deals,cust,invs},null,1)],{type:'application/json'}));a.download='rapport-backup.json';a.click()}
function shareApp(){if(navigator.share)navigator.share({title:'rapport',url:location.href}).catch(()=>{});else{try{navigator.clipboard.writeText(location.href)}catch(e){}toast('🔗 Link copied')}}
function act(a){
  if(a=='export')exportB();
  if(a=='import')$('#imp').click();
  if(a=='clear'&&confirm('Delete all sample data?')){
    deals=[];cust=[];invs=[];
    localStorage.setItem(SK,JSON.stringify({deals,cust,invs,lang,theme:document.documentElement.dataset.theme||''}));
    cloudSave();closeM();go(cur);toast('Saved');
  }
  if(a=='restore'){
    const s=JSON.parse(SD);
    deals=[...s.deals];cust=[...s.cust];invs=[...s.invs];
    localStorage.setItem(SK,JSON.stringify({deals,cust,invs,lang,theme:document.documentElement.dataset.theme||''}));
    cloudSave();closeM();go(cur);toast('Saved');
  }
}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);deals=s.deals||[];cust=s.cust||[];invs=s.invs||[];go(cur);toast('Saved')}catch(x){toast('✕ Invalid file')}};r.readAsText(f);e.target.value=''};

/* ===== INIT ===== */
document.documentElement.lang=lang=='pt'?'pt-BR':'en';
(function(){const s=localStorage.getItem('rapport-avatar');if(s)setAvatarUI(s)})();
go('Overview');
setAuthMode('login');
initAuth();
</script>

function setSync(state,label){const el=$('#syncState');if(!el)return;el.className='sync'+(state?' on':'');el.querySelector('span').textContent=label}
async function checkAdmin(){
  if(!sb||!user){isAdmin=false;return false}
  try{
    const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();
    isAdmin=!!data;
    return isAdmin;
  }catch(e){isAdmin=false;return false}
}
async function ensureFirstAdmin(){
  if(!sb||!user)return false;
  try{
    const {data:all}=await sb.from('admins').select('user_id').limit(1);
    if(!all||all.length===0){
      await sb.from('admins').insert({user_id:user.id});
      isAdmin=true;
      return true;
    }
  }catch(e){console.warn('ensureFirstAdmin',e)}
  return await checkAdmin();
}
async function cloudSave(){
  if(!sb||!user)return;
  try{
    await sb.from('app_data').upsert({user_id:user.id,data:{deals,cust,invs,lang,theme:document.documentElement.dataset.theme||''},updated_at:new Date().toISOString()},{onConflict:'user_id'});
    setSync(true,'nuvem');
  }catch(e){console.warn('cloudSave',e);setSync(false,'local')}
}
async function cloudLoad(){
  if(!sb||!user)return;
  try{
    const {data,error}=await sb.from('app_data').select('data').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    if(data?.data){
      const d=data.data;
      if(Array.isArray(d.deals))deals=d.deals;
      if(Array.isArray(d.cust))cust=d.cust;
      if(Array.isArray(d.invs))invs=d.invs;
      if(d.lang)lang=d.lang;
      if(d.theme)document.documentElement.dataset.theme=d.theme;
      setSync(true,'nuvem');
      go(cur);
    }else{cloudSave()}
  }catch(e){console.warn('cloudLoad',e);setSync(false,'local')}
}

  if(!user){setSync(false,'local');showAuth();return}

async function initAuth(){
  if(!sb){hideAuth();return}
  try{
    const {data:{session}}=await sb.auth.getSession();
    user=session?.user||null;
    if(user){await afterLogin()}else{showAuth()}
    sb.auth.onAuthStateChange(async(ev,sess)=>{
      user=sess?.user||null;
      if(user){await afterLogin()}
      else{isAdmin=false;setSync(false,'local');showAuth()}

  }catch(e){console.warn('auth',e);showAuth()}

/* ===== TELA DE LOGIN ===== */
let authMode='login';
function showAuth(){$('#auth').classList.remove('hide')}
function hideAuth(){$('#auth').classList.add('hide')}
function setAuthMode(m){
  authMode=m;
  $$('.authBox .tab span').forEach(s=>s.classList.toggle('on',s.dataset.mode===m));
  $('#authTitle').textContent=m==='login'?'Entre na sua conta':'Crie sua conta';
  $('#authBtn').textContent=m==='login'?'Entrar':'Criar conta';
  $('#confirmWrap').style.display=m==='signup'?'block':'none';
  $('#rememberWrap').style.display=m==='login'?'flex':'none';
  $('#authSwitch').innerHTML=m==='login'?'Não tem conta? <a>Criar uma</a>':'Já tem conta? <a>Entrar</a>';
  $('#authMsg').textContent='';
}
function authMsg(txt,type){const m=$('#authMsg');m.textContent=txt;m.className='msg '+(type||'')}
async function doAuth(){
  const email=$('#authEmail').value.trim();
  const pass=$('#authPass').value;
  const pass2=$('#authPass2').value;
  const btn=$('#authBtn');
  if(!email||!pass){authMsg('Preencha todos os campos','err');return}
  if(pass.length<6){authMsg('Senha mínimo 6 caracteres','err');return}
  if(authMode==='signup'&&pass!==pass2){authMsg('Senhas não coincidem','err');return}
  if(!sb){authMsg('Supabase offline','err');return}
  btn.disabled=true;btn.textContent='Aguarde…';authMsg('');
  try{
    if(authMode==='login'){
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error){authMsg(error.message.includes('Invalid')?'E-mail ou senha incorretos':error.message,'err');return}
      authMsg('Bem-vindo de volta','ok');
    }else{
      const {error}=await sb.auth.signUp({email,password:pass});
      if(error){authMsg(error.message.includes('already')?'Este e-mail já está cadastrado':error.message,'err');return}
      authMsg('Conta criada! Entrando…','ok');
    }
  }catch(e){authMsg(e.message||'Erro','err')}
  finally{btn.disabled=false;btn.textContent=authMode==='login'?'Entrar':'Criar conta'}
}
document.addEventListener('click',e=>{
  const tab=e.target.closest('.authBox .tab span');
  if(tab){setAuthMode(tab.dataset.mode);return}
  const sw=e.target.closest('#authSwitch a');
  if(sw){setAuthMode(authMode==='login'?'signup':'login');return}
  if(e.target.id==='authBtn'){doAuth();return}
  if(e.target.id==='togglePass'){const p=$('#authPass');const t=e.target;p.type=p.type==='password'?'text':'password';t.textContent=p.type==='password'?'👁️':'🙈';return}
  if(e.target.id==='togglePass2'){const p=$('#authPass2');const t=e.target;p.type=p.type==='password'?'text':'password';t.textContent=p.type==='password'?'👁️':'🙈';return}
  
  const ch=e.target.closest('[data-chart]');
  if(ch){chartMonths=ch.dataset.chart;go('Overview');return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!$('#auth').classList.contains('hide')){
    if(e.target.id==='authEmail'||e.target.id==='authPass'||e.target.id==='authPass2'){doAuth()}
  }
});

function setAvatarUI(url){
  const b=document.getElementById('avatarBtn');

function openAvatar(){
  const cur=localStorage.getItem('rapport-avatar')||'';
  openM(`<button class="x" data-x>✕</button>
    <h2 style="margin:0 0 14px;font-size:22px;font-weight:500">Seu perfil</h2>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px">

      <div style="flex:1">
        <button class="btn" id="avPick">📷 Trocar foto</button>
        ${cur?'<button class="btn o" id="avDel" style="margin-top:8px">Remover</button>':''}
      </div>
    </div>
    <div style="border-top:1px solid var(--line);padding-top:14px;margin-top:6px">
      <small style="display:block;color:var(--mut);font-size:11px;margin-bottom:8px">Conta</small>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="overflow:hidden"><div style="font-size:13px;overflow:hidden;text-overflow:ellipsis">${user?.email||''}</div><small style="color:var(--mut);font-size:11px">${isAdmin?'⭐ Você é admin':'Usuário'}</small></div><button class="btn o" id="avOut">Sair</button></div>
      ${isAdmin?'<button class="btn" id="openAdmin" style="margin-top:10px;width:100%">Painel admin</button>':''}
    </div>
    <input type="file" id="avFile" accept="image/*" hidden>`,'inv');
  document.getElementById('avPick').onclick=()=>document.getElementById('avFile').click();
  if(cur)document.getElementById('avDel').onclick=()=>{
    localStorage.removeItem('rapport-avatar');setAvatarUI('');closeM();toast('Foto removida');
  };
  const ob=document.getElementById('avOut');
  if(ob)ob.onclick=doLogout;
  const oa=document.getElementById('openAdmin');
  if(oa)oa.onclick=openAdmin;
  document.getElementById('avFile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>4*1024*1024)return toast('✕ Imagem muito grande (máx 4MB)');
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=async()=>{
        const S=256,c=document.createElement('canvas');c.width=S;c.height=S;
        const ctx=c.getContext('2d');const m=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
        const url=c.toDataURL('image/jpeg',0.82);
        try{localStorage.setItem('rapport-avatar',url)}catch(err){return toast('✕ Armazenamento cheio')}
        setAvatarUI(url);
        const pv=document.getElementById('avPreview');if(pv)pv.innerHTML=`<img src="${url}">`;
        toast('Foto atualizada');
        if(sb&&user){
          try{
            const blob=await(await fetch(url)).blob();
            const path=`${user.id}/avatar.jpg`;
            const up=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
            if(!up.error){
              const {data}=sb.storage.from('avatars').getPublicUrl(path);
              localStorage.setItem('rapport-avatar',data.publicUrl+'?t='+Date.now());
              setAvatarUI(localStorage.getItem('rapport-avatar'));
            }
          }catch(err){console.warn('avatar upload',err)}
        }
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
}

/* ===== CONFIGURAÇÕES ===== */
function settings(){openM(`<button class="x" data-x>✕</button><h2 style="margin:0 0 14px;font-size:24px;font-weight:500">Settings</h2>
<small style="color:var(--mut)">Language</small><div style="display:flex;gap:8px;margin:8px 0 18px"><button class="btn ${lang=='en'?'':'o'}" data-lg="en">English</button><button class="btn ${lang=='pt'?'':'o'}" data-lg="pt">Português</button></div>
<small style="color:var(--mut)">Sincronização</small>
<div style="margin:8px 0 18px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <span class="sync on"><b></b><span>nuvem (${user?.email||''})</span></span>
  <button class="btn o" id="cfgOut">Sair</button>
  ${isAdmin?'<button class="btn" id="cfgAdmin">Painel admin</button>':''}
</div>
<small style="color:var(--mut)">Seus dados</small><p style="margin:6px 0 12px;font-size:13px">Salvos na nuvem e neste aparelho.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn o" data-act="export">Export backup</button><button class="btn o" data-act="import">Import backup</button><button class="btn o" data-act="clear">Clear sample data</button><button class="btn o" data-act="restore">Restore sample data</button></div>`,'inv');
const o=$('#cfgOut');if(o)o.onclick=doLogout;
const a=$('#cfgAdmin');if(a)a.onclick=openAdmin;
}
function exportB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({deals,cust,invs},null,1)],{type:'application/json'}));a.download='rapport-backup.json';a.click()}
function shareApp(){if(navigator.share)navigator.share({title:'rapport',url:location.href}).catch(()=>{});else{try{navigator.clipboard.writeText(location.href)}catch(e){}toast('🔗 Link copied')}}
function act(a){
  if(a=='export')exportB();
  if(a=='import')$('#imp').click();
  if(a=='clear'&&confirm('Delete all sample data?')){
    deals=[];cust=[];invs=[];
    localStorage.setItem(SK,JSON.stringify({deals,cust,invs,lang,theme:document.documentElement.dataset.theme||''}));
    cloudSave();closeM();go(cur);toast('Saved');
  }
  if(a=='restore'){
    const s=JSON.parse(SD);
    deals=[...s.deals];cust=[...s.cust];invs=[...s.invs];
    localStorage.setItem(SK,JSON.stringify({deals,cust,invs,lang,theme:document.documentElement.dataset.theme||''}));
    cloudSave();closeM();go(cur);toast('Saved');
  }
}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);deals=s.deals||[];cust=s.cust||[];invs=s.invs||[];go(cur);toast('Saved')}catch(x){toast('✕ Invalid file')}};r.readAsText(f);e.target.value=''};

/* ===== INIT ===== */
document.documentElement.lang=lang=='pt'?'pt-BR':'en';
(function(){const s=localStorage.getItem('rapport-avatar');if(s)setAvatarUI(s)})();
go('Overview');
setAuthMode('login');
initAuth();
</script>
</body>
</html>
