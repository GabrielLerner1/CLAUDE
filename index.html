function chart(){const s=$('#rc'),tip=$('#tip');if(!s)return;const mv=e=>{const r=s.getBoundingClientRect(),px=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*700-40,i=Math.max(0,Math.min(11,Math.round(px/60))),x=i*60,y=202-(REV[i]/130*190+12-12)+12-12;
const yy=202-REV[i]/130*190-12+12;$('#cl').setAttribute('x1',x);$('#cl').setAttribute('x2',x);$('#cl').setAttribute('opacity','.4');$('#cd').setAttribute('cx',x);$('#cd').setAttribute('cy',190-REV[i]/130*190+12);$('#cd').setAttribute('opacity','1');
tip.innerHTML=`<b>${M[i]}</b><br><span style="color:var(--r)">●</span> Won ${K(REV[i]*1000)}<br>● Target $156.7K`;tr(tip);tip.style.opacity=1;tip.style.left=(scrollX+r.left+(x+40)/700*r.width+12)+'px';tip.style.top=(scrollY+r.top+40)+'px'};
s.onmousemove=mv;s.ontouchmove=mv;s.onmouseleave=()=>{tip.style.opacity=0;$('#cl').setAttribute('opacity','0');$('#cd').setAttribute('opacity','0')}}
function invModal(id){const v=invs.find(x=>x.id==id),p=v.s=='Paid';openM(`<button class="x" data-x>✕</button><h2 style="margin:0 0 8px;font-size:24px;font-weight:500">Invoice ${v.id}</h2><div style="display:flex;gap:10px;align-items:center;font-size:14px"><span class="st ${v.s}">● ${v.s}</span><b style="font-weight:500">${v.c}</b><span style="color:var(--mut)">${F(v.a)}</span></div>
<div class="paper"><div style="display:flex;justify-content:space-between"><div class="logo" style="font-size:19px"><b>R</b>rapport</div><div style="text-align:right"><small>INVOICE</small><b style="font-size:20px;font-weight:500">${v.id}</b></div></div>
<div class="two2"><div><small>FROM</small><b>Rapport Ltd.</b><br>21 Harbour Street<br>Rotterdam 3011 AB, NL<br>billing@rapport.app</div><div><small>BILL TO</small><b>${v.c}</b><br>${v.p}<br>${v.city}</div></div><hr>
<div style="display:flex;gap:24px"><span><small>Issued</small><b>${v.i}, 2026</b></span><span><small>Due</small><b>${v.d}, 2026</b></span><span><small>Terms</small><b>Net 30</b></span></div><hr>
<div class="l" style="color:var(--mut)"><span>Description</span><span>Qty &nbsp; Amount</span></div><hr><div class="l"><b>${v.it}</b><span>1 &nbsp;&nbsp; ${F(v.a)}</span></div><hr>
<div class="l" style="margin-left:40%"><span>Subtotal</span><span>${F(v.a)}</span></div><div class="l" style="margin-left:40%"><span>Tax (reverse charge)</span><span>$0</span></div><div class="l" style="margin-left:40%;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-size:17px"><b style="font-weight:500">${p?'Total paid':'Total due'}</b><b style="font-weight:500">${F(v.a)}</b></div>
<p style="color:var(--mut);margin:16px 0 0;min-height:44px">${p?'Paid in full on Oct 16, 2026 — thank you.':`Please pay by ${v.d}, 2026 to NL42 RAPP 0123 4567 89, quoting ${v.id}.`}</p>${p?'<div class="stampp">PAID</div>':''}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">${p?'':'<button class="btn" id="mp">✓ Mark paid</button>'}<button class="btn o" id="dl">⤓ Download</button><button class="btn o" id="cp">🔗 Copy link</button></div>`,'inv');
if(!p)$('#mp').onclick=()=>{v.s='Paid';save();invModal(id);toast(`✓ ${v.id} marked paid · ${F(v.a)}`,()=>{v.s='Due';closeM()})};
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`Invoice ${v.id}\n${v.c}\n${F(v.a)}\nStatus: ${v.s}`]));a.download=v.id+'.txt';a.click();toast('⤓ Download started')};
$('#cp').onclick=()=>{try{navigator.clipboard.writeText(location.href+'#'+v.id)}catch(e){}toast('🔗 Link copied')}}
function dealModal(id){const d=deals.find(x=>x.id==id),ix=stg.findIndex(s=>s[1]==d.s),pr=stg[ix][2],nx=stg[ix+1];
openM(`<button class="x" data-x>✕</button><small style="opacity:.8">Opened Sep 30, 2026</small><h2 style="margin:6px 0 2px;font-size:30px;font-weight:500">${d.t}</h2><div style="opacity:.8">${d.c}</div><div style="font-size:44px;margin:12px 0 4px">${F(d.a)}</div>
<div class="stg">${[...stg,['Won']].map((s,i)=>`<i class="${i<=ix?'on':''}" data-st="${i}"></i>`).join('')}</div><div class="stl">${[...stg,['Won']].map((s,i)=>`<span>${i==ix?'<b>'+s[0]+'</b>':s[0]}</span>`).join('')}</div>
<div class="box"><span><small>Expected close</small>${d.d}, 2026</span><span><small>Probability</small>${pr}%</span><span><small>Weighted</small>${F(d.a*pr/100)}</span></div>
<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${PEO.slice(0,3).map(p=>`<span style="display:flex;gap:6px;align-items:center"><span class="av" style="width:34px;height:34px;background:${p[1]}">${p[0]}</span>${['Sofia','Rohan','Theo'][PEO.indexOf(p)]}</span>`).join('')}</div>
<div style="opacity:.85;margin-bottom:16px">▤ Wants a pilot before committing the wider team.</div><div style="display:flex;justify-content:space-between;gap:10px"><button class="btn" style="background:none;border:1px solid #fff9" data-x data-go="Pipeline">Open in pipeline</button>${nx?`<button class="btn w" id="mv">Move to ${nx[0]} ›</button>`:''}</div>`);
$$('[data-st]').forEach(e=>e.onclick=()=>{const k=+e.dataset.st;if(k<4){const o=d.s;d.s=stg[k][1];closeM();go(cur);toast(`${d.t} → ${stg[k][0]}`,()=>{d.s=o;go(cur)})}});
if(nx)$('#mv').onclick=()=>{const o=d.s;d.s=nx[1];closeM();go(cur);toast(`${d.t} → ${nx[0]}`,()=>{d.s=o;go(cur)})}}
$('#side').innerHTML=['⌕|search','+|plus','☆|star','▦|cal','▯|phone','➤|send','⋈|share','⇪|up'].map(i=>`<button data-sb="${i.split('|')[1]}">${i.split('|')[0]}</button>`).join('')+'<hr><button data-sb="cog">⚙</button><button data-sb="moon" id="th">☾</button>';
$('#nav').onclick=e=>{if(e.target.dataset.t)go(e.target.dataset.t)};
$('#m').onclick=e=>{if(e.target.id=='m'||e.target.dataset.x!=null){closeM();if(e.target.dataset.go)go(e.target.dataset.go)}};
document.addEventListener('click',e=>{const t=e.target;
if(t.dataset.new){({deal:newDeal,cust:newCust,inv:newInv})[t.dataset.new]();return}
const sr=t.closest('[data-r]');if(sr){srch(sr.dataset.r);return}
if(t.dataset.lg){lang=t.dataset.lg;document.documentElement.lang=lang=='pt'?'pt-BR':'en';save();closeM();go(cur);return}
if(t.dataset.act){act(t.dataset.act);return}
if(t.dataset.f){cf=t.dataset.f;go('Customers');return}if(t.dataset.v){cv=t.dataset.v;go('Customers');return}
if(t.dataset.s&&t.classList.contains('star')){const c=cust.find(c=>c.i==t.dataset.s);c.f=c.f?0:1;custList();return}
const r=t.closest('tr.r');if(r){invModal(r.dataset.i);return}
const d=t.closest('.deal');if(d&&!$('#m').classList.contains('show'))dealModal(d.dataset.id)});
document.addEventListener('input',e=>{if(e.target.id=='sq'){q=e.target.value.toLowerCase();custList()}});
let drag=null;
document.addEventListener('dragstart',e=>{const d=e.target.closest('.deal');if(d){drag=+d.dataset.id;d.classList.add('dragging')}});
document.addEventListener('dragend',e=>{drag=null;$$('.over,.dragging').forEach(x=>x.classList.remove('over','dragging'))});
document.addEventListener('dragover',e=>{const z=e.target.closest('.col,.drop');if(z&&drag!=null){e.preventDefault();$$('.over').forEach(x=>x.classList.remove('over'));z.classList.add('over')}});
document.addEventListener('drop',e=>{const z=e.target.closest('.col,.drop');if(!z||drag==null)return;e.preventDefault();const d=deals.find(x=>x.id==drag);
if(z.dataset.w!=null){const w=z.dataset.w=='1',i=deals.indexOf(d);deals.splice(i,1);go('Pipeline');toast(`${w?'🏆':'✕'} ${d.t} ${w?'won':'lost'} · ${F(d.a)}`,()=>{deals.splice(i,0,d);go('Pipeline')})}
else if(z.dataset.s!=d.s){const o=d.s;d.s=z.dataset.s;go('Pipeline');toast(`✓ ${d.t} → ${stg.find(s=>s[1]==d.s)[0]}`,()=>{d.s=o;go('Pipeline')})}drag=null});
$('#side').onclick=e=>{const k=e.target.dataset.sb;if(!k)return;({search:openSearch,plus:newDeal,star:()=>{fav=!fav;cf='All';go('Customers');toast(fav?'Showing starred only':'Showing all')},cal:()=>go('Schedule'),phone:()=>go('Customers'),send:shareApp,share:exportB,up:()=>$('#imp').click(),cog:settings,moon:()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark';save()}})[k]()};
function form(title,fs,ok){openM(`<button class="x" data-x>✕</button><h2 style="margin:0 0 6px;font-size:24px;font-weight:500">${title}</h2>${fs.map(f=>`<label style="display:block;font-size:12px;color:var(--mut);margin-top:10px">${f.l}${f.o?`<select class="in" style="max-width:none;width:100%;margin-top:4px" data-k="${f.k}">${f.o.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:`<input class="in" style="max-width:none;width:100%;margin-top:4px" data-k="${f.k}" type="${f.t||'text'}">`}</label>`).join('')}<button class="btn" id="fs" style="margin-top:18px">Save</button>`,'inv');
$('#fs').onclick=()=>{const v={};$$('#mb [data-k]').forEach(e=>v[e.dataset.k]=e.value.trim());if(ok(v)!==false)closeM()}}
function newDeal(){form('New deal',[{k:'t',l:'Deal name'},{k:'c',l:'Company'},{k:'a',l:'Value',t:'number'},{k:'s',l:'Stage',o:stg.map(s=>[s[1],s[0]])},{k:'d',l:'Expected close (e.g. Nov 12)'}],v=>{if(!v.t||!(+v.a>0))return false;deals.push({id:Date.now(),t:v.t,c:v.c||'—',a:+v.a,s:v.s,d:v.d||'TBD'});go('Pipeline');toast('✓ '+v.t+' → '+stg.find(s=>s[1]==v.s)[0])})}
function newCust(){form('New customer',[{k:'n',l:'Name'},{k:'r',l:'Role'},{k:'co',l:'Company'},{k:'seg',l:'Segment',o:[['Enterprise','Enterprise'],['Mid-market','Mid-market'],['SMB','SMB']]},{k:'p',l:'Open pipeline value',t:'number'}],v=>{if(!v.n)return false;cust.push({i:Date.now(),n:v.n,r:v.r||'—',co:v.co||'—',p:+v.p||0,l:'just now',seg:v.seg,sc:50,f:0});go('Customers')})}
function newInv(){form('New invoice',[{k:'c',l:'Customer'},{k:'p',l:'Contact'},{k:'city',l:'City'},{k:'a',l:'Amount',t:'number'},{k:'it',l:'Description'},{k:'d',l:'Due date (e.g. Nov 30)'}],v=>{if(!v.c||!(+v.a>0))return false;invs.unshift({id:'RP-'+(Math.max(2400,...invs.map(x=>+x.id.slice(3)||0))+1),c:v.c,p:v.p||'—',city:v.city||'—',i:'Today',d:v.d||'Net 30',a:+v.a,s:'Draft',it:v.it||'Services'});go('Finance')})}
function openSearch(){openM(`<button class="x" data-x>✕</button><input class="in" id="gs" placeholder="Search deals, customers, invoices…" style="max-width:none;width:calc(100% - 50px)"><div id="gr" style="margin-top:12px"></div>`,'inv');$('#gs').focus();
$('#gs').oninput=e=>{const s=e.target.value.toLowerCase();if(!s){$('#gr').innerHTML='';return}const r=[...deals.filter(d=>(d.t+d.c).toLowerCase().includes(s)).map(d=>['Deal',d.t+' · '+d.c,'D'+d.id]),...cust.filter(c=>(c.n+c.co).toLowerCase().includes(s)).map(c=>['Customer',c.n+' · '+c.co,'C'+c.n]),...invs.filter(v=>(v.id+v.c).toLowerCase().includes(s)).map(v=>['Invoice',v.id+' · '+v.c,'I'+v.id])].slice(0,8);
$('#gr').innerHTML=r.map(x=>`<div data-r="${x[2]}" style="padding:10px;border-radius:14px;cursor:pointer;display:flex;gap:10px;background:var(--in);margin-bottom:6px"><small style="width:70px;color:var(--mut)">${x[0]}</small>${x[1]}</div>`).join('')||'<small style="color:var(--mut)">No results</small>';tr($('#gr'))}}
function srch(r){const k=r[0],v=r.slice(1);closeM();if(k=='D')dealModal(+v);if(k=='I')invModal(v);if(k=='C'){q=v.toLowerCase();cf='All';fav=false;go('Customers')}}
function settings(){openM(`<button class="x" data-x>✕</button><h2 style="margin:0 0 14px;font-size:24px;font-weight:500">Settings</h2><small style="color:var(--mut)">Language</small><div style="display:flex;gap:8px;margin:8px 0 18px"><button class="btn ${lang=='en'?'':'o'}" data-lg="en">English</button><button class="btn ${lang=='pt'?'':'o'}" data-lg="pt">Português</button></div><small style="color:var(--mut)">Your data</small><p style="margin:6px 0 12px;font-size:13px">Saved on this device only (this browser/app).</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn o" data-act="export">Export backup</button><button class="btn o" data-act="import">Import backup</button><button class="btn o" data-act="clear">Clear sample data</button><button class="btn o" data-act="restore">Restore sample data</button></div>`,'inv')}
function exportB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({deals,cust,invs},null,1)],{type:'application/json'}));a.download='rapport-backup.json';a.click()}
function shareApp(){if(navigator.share)navigator.share({title:'rapport',url:location.href}).catch(()=>{});else{try{navigator.clipboard.writeText(location.href)}catch(e){}toast('🔗 Link copied')}}
function act(a){if(a=='export')exportB();if(a=='import')$('#imp').click();
if(a=='clear'&&confirm(lang=='pt'?'Apagar todos os dados de exemplo?':'Delete all sample data?')){deals=[];cust=[];invs=[];closeM();go(cur);toast('Saved')}
if(a=='restore'){const s=JSON.parse(SD);deals=s.deals;cust=s.cust;invs=s.invs;closeM();go(cur);toast('Saved')}}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);deals=s.deals||[];cust=s.cust||[];invs=s.invs||[];go(cur);toast('Saved')}catch(x){toast('✕ Invalid file')}};r.readAsText(f);e.target.value=''};
document.documentElement.lang=lang=='pt'?'pt-BR':'en';
go('Overview');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
